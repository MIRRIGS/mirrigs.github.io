<body>

<div id="topbar">

  <div id="specSwitch">
    <button
      class="spec-btn active"
      onclick="switchSpec('gt', this)"
      data-tooltip
      data-tooltip-type="spec"
      data-tooltip-text="A full-size, no-compromise sim racing cockpit. Built for realism, comfort, and high-end setups with ample space. Supports most seats, including car seats, gaming seats, and fiberglass bucket seats."
    >GT-Spec</button>
    <button
      class="spec-btn"
      onclick="switchSpec('kart', this)"
      data-tooltip
      data-tooltip-type="spec"
      data-tooltip-text="A compact karting-style cockpit made for small spaces, easy storage, and affordable setups. It can be folded or stored in an area as small as 20 by 20 inches."
    >Kart-Spec</button>
  </div>

  <div id="rightBlock">

    <div id="logoDropdownWrap">
      <button id="logoDropdownBtn" aria-haspopup="true" aria-expanded="false">
        ☰ Menu
      </button>
      <div id="logoDropdown" class="dropdown-menu" role="menu">
        <a href="/" class="dropdown-item active">3D Viewer</a>
        <a href="/about" class="dropdown-item">About</a>
        <a href="/strategy" class="dropdown-item">Race Strategy <span style="font-size:9px;font-weight:900;letter-spacing:1px;color:#f10c45;background:rgba(241,12,69,0.1);border:1px solid rgba(241,12,69,0.3);border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:4px;">BETA</span></a>
      </div>
    </div>

    <div id="socials">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.9c0 1.98.52 3.91 1.5 5.61L2 22l4.66-1.61a9.86 9.86 0 0 0 5.38 1.58h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2Zm5.75 13.55c-.24.68-1.4 1.29-1.92 1.35-.48.06-1.08.09-1.74-.11-.4-.13-.91-.3-1.57-.58-2.76-1.2-4.56-4.13-4.7-4.32-.14-.19-1.12-1.49-1.12-2.84s.71-2.02.96-2.29c.24-.26.54-.33.72-.33h.52c.17 0 .4-.06.62.47.23.56.78 1.94.85 2.08.07.14.11.31.02.5-.09.19-.14.31-.28.48-.14.17-.3.33-.43.45-.14.14-.29.3-.13.59.16.29.72 1.19 1.54 1.93 1.06.94 1.95 1.24 2.24 1.38.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.28.38-.23.63-.14.25.09 1.6.76 1.88.9.28.14.47.21.54.33.07.12.07.69-.17 1.37Z"/>
        </svg>
      </a>
      <a href="https://www.instagram.com/mir_rigs" target="_blank" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">

<div id="ui">

  <h3>Cockpit Color</h3>
  <div class="group">
    <button class="color silver active" onclick="setCockpitColor('silver', this)">
      <span class="swatch silver"></span> Silver
    </button>
    <button
      class="color black"
      onclick="setCockpitColor('black', this)"
      data-tooltip="Black powder-coated cockpits cost an extra ₹2,000. Custom colors are also available."
    >
      <span class="swatch black"></span> Black
    </button>
  </div>

  <hr>

  <h3>Screen Mount</h3>

  <button onclick="selectScreen('GT_Monitor_Single_Integrated.glb', this)" data-tooltip="Compatible with standard VESA TV and monitor mounts. Integrated mounts cannot be used with the PS5 holder.">
    Single Integrated
    <span class="price" data-price-display data-base-price="6500" data-black-extra="600">(₹6,500)</span>
  </button>
  <button onclick="selectScreen('GT_Monitor_Single_Standalone.glb', this)" data-tooltip="Compatible with standard VESA TV and monitor mounts.">
    Single Standalone
    <span class="price" data-price-display data-base-price="8000" data-black-extra="600">(₹8,000)</span>
  </button>
  <button onclick="selectScreen('GT_Monitor_Triple_Integrated.glb', this)" data-tooltip="Compatible with standard VESA TV and monitor mounts. Integrated mounts cannot be used with the PS5 holder.">
    Triple Integrated
    <span class="price" data-price-display data-base-price="10000" data-black-extra="1000">(₹10,000)</span>
  </button>
  <button onclick="selectScreen('GT_Monitor_Triple_Standalone.glb', this)" data-tooltip="Compatible with standard VESA TV and monitor mounts.">
    Triple Standalone
    <span class="price" data-price-display data-base-price="13000" data-black-extra="1000">(₹13,000)</span>
  </button>

  <hr>

  <h3>Accessories</h3>

  <div class="gt-only">
    <button onclick="selectShifter('GT_Shifter_Big.glb', this)" data-tooltip="Designed for heavy-duty shifters and handbrakes. Also reinforces the wheel mount for improved rigidity.">
      Pro Shifter Mount
      <span class="price" data-price-display data-base-price="6500" data-black-extra="800">(₹6,500)</span>
    </button>
    <button onclick="selectShifter('GT_Shifter_Small.glb', this)">
      Basic Shifter Mount <span class="price">(₹3,000)</span>
    </button>
    <button onclick="toggleAddon('GT_Cupholder.glb', this)">
      Cupholder <span class="price">(₹1,000)</span>
    </button>
    <button onclick="toggleAddon('GT_Headphone_Mount.glb', this)">
      Headset Mount <span class="price">(₹1,000)</span>
    </button>
    <button onclick="togglePS5(this)" data-tooltip="Cannot be used when an integrated screen mount is selected.">
      PS5 Holder <span class="price">(₹1,500)</span>
    </button>
    <button onclick="toggleAddon('GT_Upgraded_Brackets.glb', this)" data-tooltip="Adds visual refinement and extra structural strength. Increases clearance for easier entry and exit, and recommended for high-torque wheel bases.">
      Upgraded Brackets <span class="price">(₹2,400)</span>
    </button>
  </div>

  <div class="kart-only">
    <button onclick="toggleAddon('KART_Verticle.glb', this)" data-tooltip="Used for users who need to fold or store their cockpit when not in use.">
      Vertical Supports <span class="price">(₹0)</span>
    </button>
    <button onclick="toggleAddon('KART_Legs.glb', this)" data-tooltip="Raises the cockpit off the floor. Cannot be used with vertical supports or castor wheels.">
      Legs <span class="price">(₹1,500)</span>
    </button>
    <button onclick="selectShifter('GT_Shifter_Small.glb', this)">
      Shifter Mount <span class="price">(₹3,000)</span>
    </button>
    <button onclick="toggleAddon('KART_Cupholder.glb', this)">
      Cupholder <span class="price">(₹1,000)</span>
    </button>
    <button onclick="toggleAddon('KART_Headphone_Mount.glb', this)">
      Headset Mount <span class="price">(₹1,000)</span>
    </button>
    <button onclick="togglePS5(this)" data-tooltip="Cannot be used with vertical supports or when an integrated screen mount is selected.">
      PS5 Holder <span class="price">(₹1,500)</span>
    </button>
  </div>

  <h3>Castor Wheels</h3>

  <div class="gt-only">
    <button onclick="selectWheels('GT_Wheels_4.glb', this)" data-tooltip="Paintable in any color. Lockable design keeps the cockpit firmly in place.">
      4 Wheels <span class="price">(₹4,000)</span>
    </button>
    <button onclick="selectWheels('GT_Wheels_6.glb', this)" data-tooltip="Paintable in any color. Lockable design keeps the cockpit firmly in place. Recommended for users over 100 kg.">
      6 Wheels <span class="price">(₹6,000)</span>
    </button>
  </div>

  <div class="kart-only">
    <button onclick="selectWheels('GT_Wheels_4.glb', this)" data-tooltip="Paintable in any color. Lockable design keeps the cockpit firmly in place. Cannot be used with vertical supports or legs.">
      4 Wheels <span class="price">(₹4,000)</span>
    </button>
    <button onclick="selectWheels('GT_Wheels_6.glb', this)" data-tooltip="Paintable in any color. Lockable design keeps the cockpit firmly in place. Recommended for users over 100 kg. Cannot be used with vertical supports or legs.">
      6 Wheels <span class="price">(₹6,000)</span>
    </button>
  </div>

</div>

<div id="totalPrice">₹20,000</div>
<button id="finalizeBtn">Finalize Build</button>

    <button class="close-overlay">✕</button>

    <div id="buildSummary"></div>

      Message us to finalize your order

    <div class="overlay-contacts">
      <div class="overlay-contact-row">
        <span class="overlay-contact-label">Instagram</span>
        <a href="https://www.instagram.com/mir_rigs" target="_blank" class="overlay-link">@mir_rigs</a>
      </div>
      <div class="overlay-contact-row">
        <span class="overlay-contact-label">WhatsApp</span>
        <a href="https://wa.me/919999071077" target="_blank" class="overlay-link">+91 99990 71077</a>
      </div>
    </div>
  </div>

<div id="tooltip"></div>

<div id="orbitHint">
  <span class="arrow">⟲</span>
  <span class="text">Drag to rotate</span>
</div>

<div id="viewerBrand">MIR RIGS</div>

<script>
  const dropBtn = document.getElementById("logoDropdownBtn");
  const dropMenu = document.getElementById("logoDropdown");

  dropBtn.addEventListener("click", e => {
    e.stopPropagation();
    const isOpen = dropMenu.classList.toggle("show");
    dropBtn.setAttribute("aria-expanded", isOpen);
  });

  document.addEventListener("click", () => {
    dropMenu.classList.remove("show");
    dropBtn.setAttribute("aria-expanded", false);
  });
</script>

<script type="module" src="main.js"></script>

</body>
</html>
