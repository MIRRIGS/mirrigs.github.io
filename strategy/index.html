<!-- ===== MAIN ===== -->
<div class="strategy-shell">

  <!-- LEFT: INPUT BLOCK -->
  <div class="strategy-panel inputs">
  <h3>Race Setup</h3>

  <div class="field">
    <label>
      Race Length
      <span class="error-msg"></span>
    </label>

    <div class="race-length-row">
      <input
        type="number"
        id="raceLength"
        placeholder="Enter Laps">

      <div class="race-toggle">
        <button type="button" class="race-btn active" data-mode="laps">LAPS</button>
        <button type="button" class="race-btn" data-mode="time">TIME</button>
      </div>
    </div>
  </div>

  <div class="field">
    <label>
      Pit Stop Loss (Tires Only)
      <span class="error-msg"></span>
    </label>
    <input
      type="number"
      id="pitTime"
      placeholder="Total Time Lost For A Tire Change">
  </div>

  <div class="divider"></div>

  <h3>Fuel</h3>

  <div class="field">
    <label>
      Fuel Consumption
      <span class="error-msg"></span>
    </label>
    <input
      type="number"
      id="fuelPerLap"
      step="0.1"
      placeholder="Fuel Used Per Lap (Percentage)">
  </div>

  <div class="field">
    <label>
      Starting Fuel
      <span class="error-msg"></span>
    </label>
    <input
      type="number"
      id="startingFuel"
      step="1"
      placeholder="% Of Fuel You Start The Race With">
  </div>

  <div class="field">
    <label>
      Refuelling Rate
      <span class="error-msg"></span>
    </label>
    <input
      type="number"
      id="refuelRate"
      step="0.1"
      placeholder="Litres Per Second">
  </div>

  <div class="divider"></div>

  <h3>TIRES</h3>

  <div class="tire-block tire-header">
    <div></div>
    <div></div>
    <div style="font-size:0.65rem; opacity:0.6;">Lap times</div>
    <div style="font-size:0.65rem; opacity:0.6;">Usable laps</div>
  </div>

  <div class="tire-block">
    <div class="tire-marker soft"></div>
    <div class="tire-name">Soft</div>
    <input type="number" id="softLap" placeholder="In Secs">
    <input type="number" id="softLife" placeholder="No. of Laps">
  </div>

  <div class="tire-block">
    <div class="tire-marker medium"></div>
    <div class="tire-name">Medium</div>
    <input type="number" id="medLap" placeholder="In Secs">
    <input type="number" id="medLife" placeholder="No. of Laps">
  </div>

  <div class="tire-block">
    <div class="tire-marker hard"></div>
    <div class="tire-name">Hard</div>
    <input type="number" id="hardLap" placeholder="In Secs">
    <input type="number" id="hardLife" placeholder="No. of Laps">
  </div>

  <div class="calc-actions">
    <button id="clearBtn">Clear All</button>
    <button id="calcBtn">Calculate</button>
  </div>

</div>

<div id="results" class="results"></div>

<script src="strategy.js"></script>
</body>
</html>
